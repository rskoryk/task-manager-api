name: CI

on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: chmod +x mvnw
      - run: ./mvnw test
        env:
          JWT_SECRET: c2NyZWVuZXhhbXBsZWZpbmlzaGNvcHBlcnN0ZWVsbmluZXNoYWxsb3draWxscGVhY2U=
          MAIL_USERNAME: test
          MAIL_PASSWORD: test